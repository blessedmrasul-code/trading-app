name: Render silent 2D TikTok video
on:
  push:
    branches: [main]
    paths:
      - "video-projects/two-futures/**"
      - ".github/workflows/two-futures-video.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: python -m pip install --upgrade pillow
      - name: Render silent MP4
        working-directory: video-projects/two-futures
        run: python render.py
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-futures-silent-mp4
          path: video-projects/two-futures/two-futures.mp4
          if-no-files-found: error
          retention-days: 30
