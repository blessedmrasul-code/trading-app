name: Render 2D TikTok — Two Futures
on:
  push:
    branches: [main]
    paths:
      - "video-projects/two-futures/**"
      - ".github/workflows/two-futures-video.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice engine
        run: python -m pip install --upgrade pip edge-tts pillow numpy
      - name: Render animated MP4
        working-directory: video-projects/two-futures
        run: python render.py
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: two-futures-tiktok-mp4
          path: video-projects/two-futures/two-futures.mp4
          if-no-files-found: error
          retention-days: 30
