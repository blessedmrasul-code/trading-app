name: Setup ARVEX signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate private Android signing key
        env:
          STORE_PASSWORD: ${{ secrets.ARVEX_BOOTSTRAP_TOKEN != '' && 'generated-in-next-step' || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arvex-signing"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/arvex-signing/arvex-release.keystore" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias arvex-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ARVEX Release, OU=Android, O=ARVEX, L=Unknown, ST=Unknown, C=DE"
          KEYSTORE_B64="$(base64 -w 0 "$RUNNER_TEMP/arvex-signing/arvex-release.keystore")"
          echo "::add-mask::$KEYSTORE_B64"
          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEYSTORE_B64=$KEYSTORE_B64"
          } >> "$GITHUB_ENV"

      - name: Save signing data directly to GitHub Actions Secrets
        env:
          GH_TOKEN: ${{ secrets.ARVEX_BOOTSTRAP_TOKEN }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEYSTORE_B64: ${{ env.KEYSTORE_B64 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the ARVEX_BOOTSTRAP_TOKEN repository secret before running this workflow."
            exit 1
          fi
          python -m pip install --quiet pynacl
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from nacl.public import PublicKey, SealedBox

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub API returned HTTP {exc.code}: {detail[:300]}")

          public_key = request(api + "/public-key")
          key = PublicKey(base64.b64decode(public_key["key"]))
          box = SealedBox(key)

          values = {
              "ARVEX_KEYSTORE_BASE64": os.environ["KEYSTORE_B64"],
              "ARVEX_STORE_PASSWORD": os.environ["STORE_PASSWORD"],
              "ARVEX_KEY_ALIAS": "arvex-release",
              "ARVEX_KEY_PASSWORD": os.environ["STORE_PASSWORD"],
          }
          for name, value in values.items():
              encrypted = base64.b64encode(box.encrypt(value.encode())).decode()
              request(f"{api}/{name}", "PUT", {
                  "encrypted_value": encrypted,
                  "key_id": public_key["key_id"],
              })
              print(f"Saved repository secret: {name}")

          # Remove the temporary PAT from repository secrets after it has done its job.
          try:
              request(f"{api}/ARVEX_BOOTSTRAP_TOKEN", "DELETE")
              print("Removed temporary bootstrap token from repository secrets.")
          except Exception as exc:
              print(f"WARNING: remove ARVEX_BOOTSTRAP_TOKEN manually after this run: {exc}")
          PY

      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/arvex-signing"
