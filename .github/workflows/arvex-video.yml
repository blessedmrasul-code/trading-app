name: ARVEX 30s video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install requests
      - name: Generate video
        run: python tools/arvex_video.py
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ARVEX-TikTok-30s-720p
          path: output/ARVEX-30s-720p.mp4
          retention-days: 7
