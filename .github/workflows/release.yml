name: Release (signed APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - ".release-trigger.json"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Версия приложения, например 1.0.0"
        required: true
        default: "1.0.3"
        type: string
      version_code:
        description: "Целое число версии (должно расти с каждым релизом)"
        required: true
        default: "4"
        type: string
      publish_release:
        description: "Опубликовать APK и AAB в GitHub Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve release version
        id: release
        working-directory: .
        env:
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          PUBLISH_RELEASE_INPUT: ${{ inputs.publish_release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION_NAME=$(jq -r '.version_name' .release-trigger.json)
            VERSION_CODE=$(jq -r '.version_code' .release-trigger.json)
            PUBLISH_RELEASE=true
          else
            VERSION_NAME="$VERSION_NAME_INPUT"
            VERSION_CODE="$VERSION_CODE_INPUT"
            PUBLISH_RELEASE="$PUBLISH_RELEASE_INPUT"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ARVEX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ARVEX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARVEX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARVEX_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан GitHub Actions secret для подписи: $name"
              exit 1
            fi
          done
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code должен быть положительным целым числом"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::version_name должен быть в формате 1.0 или 1.0.0"
            exit 1
          fi

      - name: Decode release keystore
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ARVEX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > mobile/arvex-release.keystore
          test -s mobile/arvex-release.keystore

      - name: Check application JavaScript syntax and smoke tests
        working-directory: .
        run: |
          for file in app.js cloud.js access.js shop-config.js cloud-config.js chart.js school.js tools.js lessons.js exam.js glossary.js scripts/verify-app.js; do
            node --check "$file"
          done
          node scripts/verify-app.js

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: npm run build:web

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply ARVEX Android launcher icons
        working-directory: mobile
        run: bash ./apply-android-icons.sh

      - name: Build signed release APK and AAB
        working-directory: mobile/android
        env:
          ARVEX_KEYSTORE: ${{ github.workspace }}/mobile/arvex-release.keystore
          ARVEX_STORE_PASSWORD: ${{ secrets.ARVEX_STORE_PASSWORD }}
          ARVEX_KEY_ALIAS: ${{ secrets.ARVEX_KEY_ALIAS }}
          ARVEX_KEY_PASSWORD: ${{ secrets.ARVEX_KEY_PASSWORD }}
          ARVEX_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ARVEX_VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -I ../signing.init.gradle \
            assembleRelease bundleRelease \
            -Pandroid.injected.version.code="$ARVEX_VERSION_CODE" \
            -Pandroid.injected.version.name="$ARVEX_VERSION_NAME"
          mkdir -p ../release-output
          cp app/build/outputs/apk/release/*.apk ../release-output/ARVEX-${ARVEX_VERSION_NAME}.apk
          cp app/build/outputs/bundle/release/*.aab ../release-output/ARVEX-${ARVEX_VERSION_NAME}.aab

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: arvex-release-${{ steps.release.outputs.version_name }}
          path: mobile/release-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        working-directory: .
        run: |
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            gh release upload "v$VERSION_NAME" \
              "mobile/release-output/ARVEX-$VERSION_NAME.apk" \
              "mobile/release-output/ARVEX-$VERSION_NAME.aab" \
              --clobber
            gh release edit "v$VERSION_NAME" \
              --title "ARVEX $VERSION_NAME" \
              --notes "Подписанный релиз ARVEX. APK для установки на Android; AAB для Google Play. Учебный симулятор, используются виртуальные средства."
          else
            gh release create "v$VERSION_NAME" \
              "mobile/release-output/ARVEX-$VERSION_NAME.apk" \
              "mobile/release-output/ARVEX-$VERSION_NAME.aab" \
              --title "ARVEX $VERSION_NAME" \
              --notes "Подписанный релиз ARVEX. APK для установки на Android; AAB для Google Play. Учебный симулятор, используются виртуальные средства."
          fi
