name: ARVEX static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/arvex-premium-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app assets, JavaScript syntax, and PREMIUM wiring
        run: node scripts/validate.mjs
