name: Build APK

# Запуск вручную: Actions → Build APK → Run workflow
# Проверочный запуск после настройки NETLIFY_AUTH_TOKEN (повторный запуск)
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/main.yml"
      - "index.html"
      - "style.css"
      - "app.js"
      - "access.js"
      - "shop-config.js"
      - "offer.html"
      - "cloud.js"
      - "cloud-config.js"
      - "backend/**"
      - "supabase/**"
      - "chart.js"
      - "school.js"
      - "tools.js"
      - "lessons.js"
      - "exam.js"
      - "glossary.js"
      - "logo.png"
      - "favicon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "manifest.webmanifest"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать APK в GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        working-directory: .
        run: |
          deno check supabase/functions/create-stars-invoice/index.ts
          deno check supabase/functions/telegram-stars-webhook/index.ts
          deno check supabase/functions/cancel-stars-subscription/index.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check application JavaScript syntax
        working-directory: .
        run: |
          for file in app.js cloud.js access.js shop-config.js cloud-config.js chart.js school.js tools.js lessons.js exam.js glossary.js; do
            node --check "$file"
          done

      - name: Install dependencies
        run: npm install

      - name: Build web files (www)
        run: npm run build:web

      - name: Deploy website to Netlify
        working-directory: .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN is not configured; website deploy skipped."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir . --site a78b925e-f43c-4e3f-a9de-873439ac6e85 --auth "$NETLIFY_AUTH_TOKEN" --message "ARVEX production deploy from GitHub Actions"

      - name: Create Android project (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          PROPS=gradle/wrapper/gradle-wrapper.properties
          VER=$(grep -o 'gradle-[0-9.]*-bin' $PROPS | head -1)
          NUM=${VER#gradle-}
          NUM=${NUM%-bin}
          grep -v '^networkTimeout=' $PROPS > p.tmp && mv p.tmp $PROPS
          echo "networkTimeout=300000" >> $PROPS
          chmod +x ./gradlew
          # Сначала адрес по умолчанию, затем запасной источник Gradle
          for URL in \
            "" \
            "https\://github.com/gradle/gradle-distributions/releases/download/v$NUM/$VER.zip"; do
            if [ -n "$URL" ]; then
              echo "=== Пробуем $URL"
              sed -i "s#^distributionUrl=.*#distributionUrl=$URL#" $PROPS
            fi
            if ./gradlew assembleDebug --no-daemon; then
              echo "BUILD_OK"
              exit 0
            fi
          done
          echo "Сборка не удалась ни с одним источником Gradle"
          exit 1

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: arvex-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: mobile
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.path }}" \
            --title "ARVEX APK ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK, собран GitHub Actions. Учебный симулятор, виртуальные средства."
