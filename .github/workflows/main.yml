name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unzip app
        run: unzip -o app.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        run: |
          PROPS=gradle/wrapper/gradle-wrapper.properties
          cat $PROPS
          VER=$(grep -o 'gradle-[0-9.]*-bin' $PROPS | head -1)
          for URL in \
            "https\://services.gradle.org/distributions/$VER.zip" \
            "https\://downloads.gradle.org/distributions/$VER.zip" \
            "https\://mirrors.cloud.tencent.com/gradle/$VER.zip" \
            "https\://mirrors.huaweicloud.com/gradle/$VER.zip" \
            "https\://services.gradle.org/distributions/$VER.zip"; do
            echo "=== Пробуем $URL"
            sed -i "s#^distributionUrl=.*#distributionUrl=$URL#" $PROPS
            if ./gradlew assembleRelease --no-daemon; then
              echo "BUILD_OK"
              exit 0
            fi
            sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: podskazka-trader-apk
          path: android/app/build/outputs/apk/release/*.apk
