name: Build APK

# Запуск вручную: Actions → Build APK → Run workflow
# Проверочный запуск после настройки NETLIFY_AUTH_TOKEN (повторный запуск)
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/**"
      - ".github/workflows/main.yml"
      - "index.html"
      - "style.css"
      - "app.js"
      - "access.js"
      - "shop-config.js"
      - "offer.html"
      - "cloud.js"
      - "cloud-config.js"
      - "backend/**"
      - "supabase/**"
      - "chart.js"
      - "school.js"
      - "tools.js"
      - "lessons.js"
      - "exam.js"
      - "glossary.js"
      - "logo.png"
      - "favicon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "manifest.webmanifest"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать APK в GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        working-directory: .
        run: |
          deno check supabase/functions/create-stars-invoice/index.ts
          deno check supabase/functions/create-stars-bot-link/index.ts
          deno check supabase/functions/telegram-stars-webhook/index.ts
          deno check supabase/functions/cancel-stars-subscription/index.ts
          deno check supabase/functions/admin-user-ban/index.ts
          deno check supabase/functions/delete-own-account/index.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check application JavaScript syntax
        working-directory: .
        run: |
          for file in app.js cloud.js access.js shop-config.js cloud-config.js chart.js school.js tools.js lessons.js exam.js glossary.js; do
            node --check "$file"
          done

      - name: Run ARVEX smoke tests
        working-directory: .
        run: node scripts/verify-app.js

      - name: Install dependencies
        run: npm install

      - name: Build web files (www)
        run: |
          npm run build:web
          # Keep the /app/ website route in sync with the exact bundle used by Android.
          rm -rf ../app
          mkdir -p ../app
          cp -a www/. ../app/

      - name: Deploy website to Netlify
        continue-on-error: true
        working-directory: .
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN is not configured; website deploy skipped."
            exit 0
          fi
          echo "=== Netlify token diagnostic (token value is never printed)"
          USER_CODE=$(curl -sS -o /tmp/netlify-user.json -w "%{http_code}" -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/user || true)
          echo "Netlify /user HTTP: $USER_CODE"
          if [ "$USER_CODE" = "200" ]; then
            jq '{id, email, account_id}' /tmp/netlify-user.json
          else
            jq -c '{message, code, error}' /tmp/netlify-user.json 2>/dev/null || head -c 300 /tmp/netlify-user.json
            echo
          fi
          SITE_CODE=$(curl -sS -o /tmp/netlify-site.json -w "%{http_code}" -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/sites/a78b925e-f43c-4e3f-a9de-873439ac6e85 || true)
          echo "Netlify /sites/{ARVEX_SITE_ID} HTTP: $SITE_CODE"
          if [ "$SITE_CODE" = "200" ]; then
            jq '{id, name, account_id, url, ssl_url, prevent_non_git_prod_deploys, git_provider, repo, build_settings}' /tmp/netlify-site.json
          else
            jq -c '{message, code, error}' /tmp/netlify-site.json 2>/dev/null || head -c 300 /tmp/netlify-site.json
            echo
          fi
          echo "=== End Netlify token diagnostic"
          echo "=== Netlify CLI debug deploy (credentials redacted by CLI)"
          npx --yes netlify-cli deploy --debug --prod --dir . --site a78b925e-f43c-4e3f-a9de-873439ac6e85 --auth "$NETLIFY_AUTH_TOKEN" --message "ARVEX production deploy from GitHub Actions"

      - name: Create Android project (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Register ARVEX OAuth deep link
        run: node configure-android.js

      - name: Apply ARVEX Android launcher icons
        working-directory: mobile
        run: bash ./apply-android-icons.sh

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          PROPS=gradle/wrapper/gradle-wrapper.properties
          VER=$(grep -o 'gradle-[0-9.]*-bin' $PROPS | head -1)
          NUM=${VER#gradle-}
          NUM=${NUM%-bin}
          grep -v '^networkTimeout=' $PROPS > p.tmp && mv p.tmp $PROPS
          echo "networkTimeout=300000" >> $PROPS
          chmod +x ./gradlew
          # Сначала адрес по умолчанию, затем запасной источник Gradle
          for URL in \
            "" \
            "https\://github.com/gradle/gradle-distributions/releases/download/v$NUM/$VER.zip"; do
            if [ -n "$URL" ]; then
              echo "=== Пробуем $URL"
              sed -i "s#^distributionUrl=.*#distributionUrl=$URL#" $PROPS
            fi
            if ./gradlew assembleDebug --no-daemon; then
              echo "BUILD_OK"
              exit 0
            fi
          done
          echo "Сборка не удалась ни с одним источником Gradle"
          exit 1

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: arvex-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: mobile
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.path }}" \
            --title "ARVEX APK ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK, собран GitHub Actions. Учебный симулятор, виртуальные средства."
