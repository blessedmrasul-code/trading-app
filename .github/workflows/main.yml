name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Unzip app
        run: unzip -o app.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix babel-preset-expo version
        run: npm pkg set dependencies.babel-preset-expo="~57.0.17"

      - run: npm install

      - run: npx expo install --fix

      - run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: |
          PROPS=gradle/wrapper/gradle-wrapper.properties
          VER=$(grep -o 'gradle-[0-9.]*-bin' $PROPS | head -1)
          NUM=${VER#gradle-}
          NUM=${NUM%-bin}
          grep -v '^networkTimeout=' $PROPS > p.tmp && mv p.tmp $PROPS
          echo "networkTimeout=300000" >> $PROPS
          for URL in \
            "https\://github.com/gradle/gradle-distributions/releases/download/v$NUM/$VER.zip" \
            "https\://services.gradle.org/distributions/$VER.zip"; do
            echo "=== Пробуем $URL"
            sed -i "s#^distributionUrl=.*#distributionUrl=$URL#" $PROPS
            if ./gradlew assembleRelease --no-daemon; then
              echo "BUILD_OK"
              exit 0
            fi
          done
          echo "=== Пробуем Gradle, установленный на сервере"
          which gradle && gradle --version
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: podskazka-trader-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${GITHUB_RUN_NUMBER}" android/app/build/outputs/apk/release/*.apk \
            --title "APK сборка ${GITHUB_RUN_NUMBER}" \
            --notes "APK автоматически собран GitHub Actions."
